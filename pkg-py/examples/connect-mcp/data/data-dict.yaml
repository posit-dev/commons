$version: "0.1.0"
$learn_more: https://data-dict.tidyverse.org/
name: Synthetic hospital events
description: Public synthetic records generated by generate_hospital.py, unrelated to real hospitals or patients.
tables:
  - name: hospital_events
    description: One row per recorded event. No patient, date, or exposure-denominator fields are supplied.
    columns:
      - name: hospitals_table
        type: string
        description: Synthetic hospital name, including Example General Hospital, Example Port Hospital, Example Military Hospital, and Example Women's Hospital.
      - name: events_table
        type: string
        description: Recorded event category, such as diagnostic error or medication error.
      - name: severity_table
        type: string
        description: Categorical severity label (Level 1, Level 2, Level 3). Clinical meaning and ordering are unspecified.
