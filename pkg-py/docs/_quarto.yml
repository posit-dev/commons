project:
  type: website
  # Renders in place, because Quarto warns when its output directory sits
  # outside the project. The deploy workflow copies _site into docs/py.
  output-dir: _site
  # Explicit, so the design notes under notes/ stay out of the site.
  render:
    - index.qmd
    - get-started.qmd
    - governance.qmd
    - feature-parity.qmd
    - reference/*.qmd
  # Copied whole: Quarto follows the <link> tags in favicon.html, but not the
  # icons site.webmanifest names inside itself.
  resources:
    - favicon/**

website:
  title: "commons"
  site-url: https://posit-dev.github.io/commons/py/
  repo-url: https://github.com/posit-dev/commons
  repo-subdir: pkg-py
  navbar:
    logo: assets/logos/python-logo.svg
    left:
      - href: get-started.qmd
        text: Get started
      - href: governance.qmd
        text: Security and governance
      - href: feature-parity.qmd
        text: Feature parity
      - href: reference/index.qmd
        text: API Reference
    right:
      - text: '<span class="r-logo" title="R Documentation">R Documentation</span>'
        href: ../r/
      - icon: github
        href: https://github.com/posit-dev/commons
  sidebar:
    - id: reference
      contents: reference/_sidebar.yml
  page-footer:
    left: "Developed by Josh Taillon, Posit Software, PBC."
    right: "Site built with [Quarto](https://quarto.org/)."

format:
  html:
    theme: cosmo
    toc: true
    css: assets/styles.css
    include-in-header: favicon.html

metadata-files:
  - reference/_sidebar.yml

quartodoc:
  package: commons
  title: Reference
  style: pkgdown
  dir: reference
  sidebar: reference/_sidebar.yml
  render_interlinks: false
  renderer:
    style: markdown
    table_style: description-list
  sections:
    - title: Main functions
      desc: |
        The main agent constructor, plus the building blocks for a commons agent.
      contents:
        - Commons
        - data_source
        - semantic_layer
        - measure
        - context_layer
    - title: Supporting types
      desc: |
        The objects the constructors return, and the values they carry.
      contents:
        - DataSource
        - SemanticLayer
        - ContextLayer
        - Measure
        - Injected
        - Tag
        - list_tables
    - title: Shiny UI and server
      desc: |
        Put a commons agent inside of an interactive chat app. Needs the
        `shiny` extra.
      package: commons.ui
      contents:
        - app
        - server
        - theme
        - commons_chat_dependency
        - asset_base_url
