[project]
name = "commons"
version = "0.1.0.dev1"
description = "AI Agents for Data Analysis"
readme = "README.md"
# Upper bound tracks raghilda, which caps at <3.14 (posit-dev/raghilda#93).
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]
dependencies = [
    "chatlas>=0.21.2",
    "pydantic>=2",
    "duckdb>=1.0",
    "raghilda>=0.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6",
    "jinja2>=3",
    "pyarrow>=17",
]

[project.urls]
Homepage = "https://github.com/posit-dev/commons"
Issues = "https://github.com/posit-dev/commons/issues"

[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-json-file",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "pyrefly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# `tests` is a package rooted here, not under src/, so imports between test
# modules only resolve with this directory on the search path.
search-path = [".", "src"]
python-version = "3.11"
