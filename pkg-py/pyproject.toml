[project]
name = "commons"
version = "0.1.0.dev1"
description = "AI Agents for Data Analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]
dependencies = [
    "chatlas>=0.22.0",
    "pydantic>=2",
    "duckdb>=1.0",
    "raghilda>=0.2.1",
    "sqlalchemy>=2.0",
    "pyyaml>=6",
    "jinja2>=3",
    "pyarrow>=17",
    "sqlglot>=25",
]

[project.urls]
Homepage = "https://github.com/posit-dev/commons"
Issues = "https://github.com/posit-dev/commons/issues"

[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-json-file",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "pyrefly", "pandas>=2", "polars>=1", "pins>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
# `tests` is a package rooted here, not under src/, so imports between test
# modules only resolve with this directory on the search path.
search-path = [".", "src"]
python-version = "3.11"
