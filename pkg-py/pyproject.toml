[project]
name = "posit-commons"
version = "0.1.0.dev0"
description = "Build trustworthy data agents (Python port of the commons R package)."
readme = "README.md"
# The PyPI name `commons` is taken, so the distribution is `posit-commons` and
# the import name is `commons` (D7). Nothing infers that split; see
# [tool.hatch.build.targets.wheel] below.
requires-python = ">=3.11"
classifiers = ["Development Status :: 2 - Pre-Alpha"]
dependencies = [
    "chatlas>=0.21.2",
    "pydantic>=2",
    "duckdb>=1.0",
    "raghilda>=0.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6",
    "jinja2>=3",
    "pyarrow>=17",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-json-file",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "pyrefly"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling derives the package directory from the *distribution* name, so
# this packages line is required to have a package import name that differs
# from the PyPI distribution name
[tool.hatch.build.targets.wheel]
packages = ["src/commons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.11"
