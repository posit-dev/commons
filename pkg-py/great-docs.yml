# The site is assembled by great-docs, which generates a Quarto project into
# great-docs/ and renders it.
display_name: commons
site_url: https://posit-dev.github.io/commons/py/
repo: https://github.com/posit-dev/commons
pypi: https://pypi.org/project/commons/

# The narrative pages. This is a directory, and everything under it is
# rendered, which is why the design notes live in ../notes instead.
user_guide: docs

# The generated changelog reads GitHub Releases for the whole repository with
# no tag-prefix filter, so it renders the R package's notes on this site.
changelog:
  enabled: false

# Names are relative to the package: `ui.app`, not `commons.ui.app`. A
# section-level `package:` key is accepted and then ignored. `commons.__all__`
# does not export `ui`, so the Shiny entries only appear because they are
# listed here.
reference:
  - title: Main functions
    desc: The main agent constructor, plus the building blocks for a commons agent.
    contents: [Commons, data_source, semantic_layer, measure, context_layer]
  - title: Supporting types
    desc: The objects the constructors return, and the values they carry.
    contents: [DataSource, SemanticLayer, ContextLayer, Measure, Injected, Tag, list_tables]
  - title: Shiny UI and server
    desc: "Put a commons agent inside of an interactive chat app. Needs the `shiny` extra."
    contents: [ui.app, ui.server, ui.theme, ui.commons_chat_dependency, ui.asset_base_url]

# Nested under `site:`, which is the key great-docs reads; a top-level
# `css:` is silently ignored. Paths are relative to the project root.
site:
  css:
    - docs/assets/styles.css

# The hex sticker is the site's mark, shown in the navbar and, larger, on the
# landing page. It used to be an inline image in index.qmd, which great-docs
# would have shown underneath its own logo.
logo:
  light: docs/assets/hex/commons-hex.png

authors:
  - name: Josh Taillon
    role: Maintainer
    affiliation: Posit, PBC

funding:
  name: Posit Software, PBC
  roles:
    - Copyright holder
    - funder
  homepage: https://posit.co

include_in_header:
  # The icon tags pkgdown writes for the R site, so both serve the same icons
  # from the shared /favicon/ at the site root. A leading / is
  # project-relative and Quarto rewrites it per page depth. great-docs'
  # `favicon:` key takes a single file and would drop the manifest and the
  # other sizes.
  - text: |
      <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
      <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
      <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
      <link rel="icon" sizes="any" href="/favicon/favicon.ico">
      <link rel="manifest" href="/favicon/site.webmanifest">
  # No config key adds a navbar link, and the generated _quarto.yml is
  # rewritten on every build, so the R cross-link is injected instead.
  # great-docs collects its own widgets into #gd-navbar-widgets, which is
  # built by a script that runs after this one, so the container is polled for
  # rather than assumed. Joining that container is what gets the shared flex
  # alignment and gap; the gd-navbar-icon class is what makes the link look
  # like the neighbouring buttons. The href is absolute so it works from a
  # pull request preview and from every /v/ copy, matching the mirror-image
  # link in pkg-r/_pkgdown.yml.
  - text: |
      <script>
      (function () {
        var tries = 0;
        function inject() {
          if (document.querySelector(".commons-r-link")) return;
          var tools = document.getElementById("gd-navbar-widgets");
          if (!tools) {
            if (tries++ < 100) return window.setTimeout(inject, 50);
            return;
          }
          var link = document.createElement("a");
          link.className = "nav-link gd-navbar-icon commons-r-link";
          link.href = "https://posit-dev.github.io/commons/r/";
          link.title = "R Documentation";
          link.setAttribute("aria-label", "R documentation");
          link.innerHTML = '<span class="r-logo"></span>';
          tools.insertBefore(link, tools.firstChild);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", inject);
        } else {
          inject();
        }
      })();
      </script>

versions:
  - label: "0.2.0 (dev)"
    tag: dev
    version: "0.2.0"
    prerelease: true
  # A beta, but the only published release, so it holds the latest slot and is
  # what /py/ serves: that matches what `pip install commons` resolves to.
  # `latest` has to be set explicitly, because a prerelease is excluded from
  # latest auto-detection and every entry here is one. The beta warning is
  # carried by the announcement banner rather than by a selector badge.
  - label: "0.1.0b1"
    tag: "0.1.0b1"
    version: "0.1.0b1"
    prerelease: true
    latest: true

version_selector:
  enabled: true
  placement: navbar-right
  warning_banner: true

version_aliases:
  latest: true
  stable: true
  dev: true

announcement:
  content: "`commons` for Python is a **beta** and does not yet do everything the R package does."
  type: info
  url: user-guide/feature-parity.html
  dismissable: true
