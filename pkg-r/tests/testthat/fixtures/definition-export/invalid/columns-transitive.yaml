$version: "0.1.0"
$learn_more: https://data-dict.tidyverse.org/
tables:
  - name: orders
    columns:
      - name: amount
        type: number(quantity)
        range: [0, 1000]
      - name: quantity
        type: number(quantity)
        range: [0, 100]
    definitions:
      - name: positive amount
        expr: COLUMNS([amount]) > 0
      - name: broken
        expr: '`positive amount` AND COLUMNS([quantity]) > 0'
