name: "Py: Package checks"

on:
  push:
    branches: [main]
    paths: [pkg-py/**, tests/shared/**, .github/workflows/py-check.yaml]
  pull_request:
    paths: [pkg-py/**, tests/shared/**, .github/workflows/py-check.yaml]
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # A deadlock in the worker tests fails the leg instead of hanging it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One arm64 leg, for the seccomp filter's aarch64 syscall numbers.
          # They are the same at every Python version, so one is enough.
          - os: ubuntu-24.04-arm
            python-version: "3.13"
    defaults:
      run:
        working-directory: pkg-py
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pkg-py/uv.lock
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        # Explicit paths: with none, pyrefly consults the repo's git ignore
        # files, and a worktree checked out under an ignored directory
        # silently type-checks nothing.
        run: uv run pyrefly check src tests
      - name: Test
        run: uv run pytest
      - name: Verify the built wheel ships the browser assets
        # The suite runs against an editable install, which reads src/ and so
        # passes whatever the wheel contains. Only the release workflow built
        # a wheel before this, so a dropped asset would have surfaced at
        # publish time, in a browser.
        run: |
          uv build --wheel -o dist
          uv run python -c "
          import glob, sys, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              'commons/www/commons-chat/commons-chat.js',
              'commons/www/commons-chat/commons-chat.css',
              'commons/www/commons-chat/figs/citation-mark.svg',
          }
          missing = sorted(required - names)
          if missing:
              sys.exit(f'{wheel} is missing: {missing}')
          print(f'{wheel} ships the browser assets')
          "

  seccomp-32bit:
    # The interpreter tests feed each syscall table its own numbers, so a
    # mis-transcribed i386 or arm number passes them. These legs rerun the
    # seccomp suite under a 32-bit personality, which an x86_64 or arm64
    # kernel runs natively while tagging the syscalls with the 32-bit ABI,
    # so the live tests check the 32-bit tables against the kernel itself.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/386
            arch: i386
          - os: ubuntu-24.04-arm
            platform: linux/arm/v7
            arch: arm
    steps:
      - uses: actions/checkout@v6
      - name: Refuse to pass on a skip
        # needs_seccomp skips the live tests when arch detection or the
        # filter install fails, and a leg where all ten skip has tested
        # nothing. Fail first instead, in the same environment the suite
        # then runs in.
        run: |
          docker run --rm \
            --platform '${{ matrix.platform }}' \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/pkg-py \
            python:3.13-slim \
            python -c "
          import sys
          sys.path.insert(0, 'src/commons/_execution/_runtime')
          import _seccomp
          arch = _seccomp.current_arch()
          assert arch is not None and arch.name == '${{ matrix.arch }}', arch
          assert _seccomp.seccomp_available(), 'a filter does not install here'
          print(f'{arch.name}: a filter installs')
          "
      - name: Engage Landlock and seccomp together
        # The pair the worker engages on a host with Landlock. The suite
        # below covers seccomp alone, and the Landlock tests import commons.
        # Run once under each personality: setarch linux32 reports the
        # 32-bit machine name a native 32-bit host does, so a gate that
        # trusts uname fails there instead of passing on the host's name.
        run: |
          script="
          import sys
          sys.path.insert(0, 'src/commons/_execution/_runtime')
          import _landlock, _seccomp
          abi = _landlock.engage(['/'], ['/tmp'])
          assert abi is not None, 'Landlock is not available here'
          _seccomp.engage(network='none')
          open('/tmp/inside', 'w').close()
          try:
              open('/work/outside', 'w').close()
          except PermissionError:
              print(f'Landlock ABI {abi} and seccomp engaged')
          else:
              sys.exit('a write outside the write root went through')
          "
          for personality in "" "setarch linux32"; do
            docker run --rm \
              --platform '${{ matrix.platform }}' \
              --security-opt seccomp=unconfined \
              -v "$GITHUB_WORKSPACE:/work" \
              -w /work/pkg-py \
              python:3.13-slim \
              $personality python -c "$script"
          done
      - name: Run the seccomp suite under a 32-bit personality
        # seccomp=unconfined lifts docker's own filter, which refuses some
        # of the calls these tests make unfiltered as a control (ptrace,
        # pidfd_getfd) and would turn the live checks into skips. The
        # filter under test is then the only one on the process.
        # --noconftest: the suite-wide conftest imports commons, whose
        # dependencies publish no 32-bit wheels; the seccomp file uses
        # none of its fixtures.
        # No setarch: the container keeps the host's 64-bit uname
        # personality, and arch detection has to find the 32-bit table from
        # the interpreter's binary regardless.
        run: |
          docker run --rm \
            --platform '${{ matrix.platform }}' \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/pkg-py \
            python:3.13-slim \
            sh -c "pip install -q pytest && python -m pytest --noconftest -rs tests/test_execution_seccomp.py"
