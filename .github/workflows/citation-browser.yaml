name: "R: Citation browser tests"

on:
  push:
    branches: [main]
    paths: [pkg-r/**, tests/shared/**, .github/workflows/citation-browser.yaml]
  pull_request:
    paths: [pkg-r/**, tests/shared/**, .github/workflows/citation-browser.yaml]
  workflow_dispatch:

permissions: read-all

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pkg-r
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      # Temporary, with the job timeout: the runner's Azure Ubuntu mirror stalls apt.
      - name: Use the main Ubuntu archive for apt
        if: runner.os == 'Linux'
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f"
            fi
          done
          if grep -rqs 'azure\.archive\.ubuntu\.com' /etc/apt; then
            echo "::error::apt still names azure.archive.ubuntu.com"
            exit 1
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::devtools, any::shinytest2, any::chromote
          needs: check
          working-directory: pkg-r
      - name: Locate Chrome
        run: Rscript -e 'stopifnot(nzchar(chromote::find_chrome()))'
      - name: Run citation browser tests
        run: Rscript -e 'devtools::test(filter = "citation-browser")'
