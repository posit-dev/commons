on:
  push:
    branches: [main]
    paths: [pkg-py/**, docs/**, .github/workflows/quartodoc.yaml]
  pull_request:
    paths: [pkg-py/**, docs/**, .github/workflows/quartodoc.yaml]
  release:
    types: [published]
  workflow_dispatch:

name: quartodoc.yaml

permissions: read-all

jobs:
  quartodoc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg-py
    # Every run that can push to gh-pages shares one group, including pull
    # request previews. Two pushes to one branch race, and the cleanup
    # workflow joins this group so a closing PR's build cannot recreate the
    # folder the cleanup just removed.
    concurrency:
      group: gh-pages
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the package and its docs dependencies
        run: uv sync --extra shiny --group docs

      - name: Build the reference pages
        working-directory: pkg-py/docs
        run: uv run quartodoc build

      - name: Render the site
        working-directory: pkg-py/docs
        run: uv run quarto render

      # The deploy publishes the whole of docs/, so the rendered site has to
      # sit at the path it is served from.
      - name: Move the site into place
        working-directory: .
        run: |
          rm -rf docs/py
          cp -r pkg-py/docs/_site docs/py

      # `clean: false` so this and the pkgdown deploy can each own a
      # subdirectory of the same branch without erasing the other.
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

      # A fork's GITHUB_TOKEN is read-only, so the deploy and the comment both
      # fail there. Fork previews are not worth the alternative: publishing
      # fork-authored HTML to posit-dev.github.io means serving unreviewed
      # content from our own origin.
      - name: Deploy the pull request preview 🔎
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          target-folder: pr-${{ github.event.number }}

      - name: Comment the preview link
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-py
          message: |
            **Python site preview:** [https://posit-dev.github.io/commons/pr-${{ github.event.number }}/py/](https://posit-dev.github.io/commons/pr-${{ github.event.number }}/py/)

            Built from the latest commit on this branch. The landing page's R link resolves inside the preview only if this pull request also rebuilt the R site.
