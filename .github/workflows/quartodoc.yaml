on:
  push:
    branches: [main]
    paths: [pkg-py/**, docs/**, .github/workflows/quartodoc.yaml]
  pull_request:
    paths: [pkg-py/**, docs/**, .github/workflows/quartodoc.yaml]
  release:
    types: [published]
  workflow_dispatch:

name: quartodoc.yaml

permissions: read-all

jobs:
  quartodoc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg-py
    # Per workflow and per pull request, so a run supersedes an older pending
    # run of the same site. Serializing every gh-pages push in one group would
    # be wrong: Actions keeps only one pending run per group, so a third
    # arrival cancels the queued one outright and its preview never publishes.
    # Races between the two sites are handled at the push instead, by the
    # deploy action's rebase.
    concurrency:
      group: quartodoc-${{ github.event.number || github.ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the package and its docs dependencies
        run: uv sync --extra shiny --group docs

      - name: Build the reference pages
        working-directory: pkg-py/docs
        run: uv run quartodoc build

      - name: Render the site
        working-directory: pkg-py/docs
        run: uv run quarto render

      # The deploy publishes the whole of docs/, so the rendered site has to
      # sit at the path it is served from.
      - name: Move the site into place
        working-directory: .
        run: |
          rm -rf docs/py
          cp -r pkg-py/docs/_site docs/py

      # `clean: false` so this and the pkgdown deploy can each own a
      # subdirectory of the same branch without erasing the other.
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          # Both sites and the preview deploys push to this one branch, so a
          # deploy has to rebase onto whatever landed while it was building.
          # Forcing would silently drop that other deploy.
          force: false
          attempt-limit: 10

      # A fork's GITHUB_TOKEN is read-only, so the deploy and the comment both
      # fail there. Fork previews are not worth the alternative: publishing
      # fork-authored HTML to posit-dev.github.io means serving unreviewed
      # content from our own origin.
      - name: Mark the preview noindex
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        working-directory: .
        run: python3 .github/scripts/noindex-preview.py docs

      - name: Deploy the pull request preview 🔎
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          target-folder: pr-${{ github.event.number }}
          force: false
          attempt-limit: 10

      - name: Comment the preview link
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-py
          message: |
            **Preview root:** [https://posit-dev.github.io/commons/pr-${{ github.event.number }}/](https://posit-dev.github.io/commons/pr-${{ github.event.number }}/)

            **Python site preview:** [https://posit-dev.github.io/commons/pr-${{ github.event.number }}/py/](https://posit-dev.github.io/commons/pr-${{ github.event.number }}/py/)

            Built from the latest commit on this branch. The R links in it point at the published R site, which no pull request rebuilds.
