name: "R: R CMD check"

on:
  push:
    branches: [main]
    paths: [pkg-r/**, tests/shared/**, .github/workflows/R-CMD-check.yaml]
  pull_request:
    paths: [pkg-r/**, tests/shared/**, .github/workflows/R-CMD-check.yaml]
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: oldrel-2}
          - {os: ubuntu-latest, r: oldrel-3}
    env:
      COMMONS_SKIP_BROWSER_TESTS: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # odbc has no macOS arm64 binary for this R release on either P3M or
          # its CRAN mirror fallback right now; skip it rather than failing
          # the whole check. kata 52s4.
          extra-packages: any::rcmdcheck, local::., odbc=?ignore-unavailable
          needs: check
          working-directory: pkg-r
          cache-version: 2
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: pkg-r
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
