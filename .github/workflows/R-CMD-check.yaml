name: "R: R CMD check"

on:
  push:
    branches: [main]
    paths: [pkg-r/**, tests/shared/**, .github/workflows/R-CMD-check.yaml]
  pull_request:
    paths: [pkg-r/**, tests/shared/**, .github/workflows/R-CMD-check.yaml]
  workflow_dispatch:
  # R-devel runs only off pull requests, so check it weekly as well.
  schedule:
    - cron: "0 6 * * 1"

permissions: read-all

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: oldrel-2}
          - {os: ubuntu-latest, r: oldrel-3}
    env: &check-env
      COMMONS_SKIP_BROWSER_TESTS: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps: &check-steps
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      # Temporary: the runner's Azure Ubuntu mirror stalls apt for 20+ minutes.
      - name: Use the main Ubuntu archive for apt
        if: runner.os == 'Linux'
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            if [ -f "$f" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/|http://archive.ubuntu.com/|g' "$f"
            fi
          done
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      # BEGIN odbc workaround: remove this step once mac.cran.dev serves a
      # gzip odbc binary (posit-dev/commons#388). pak cannot extract the
      # Zstandard file it serves now, but pak keeps an installed copy whose
      # build matches, so install CRAN's copy first.
      - name: Install odbc from CRAN
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          install.packages("odbc", lib = lib, repos = "https://cran.r-project.org")
          stopifnot(nzchar(system.file(package = "odbc", lib.loc = lib)))
      # END odbc workaround
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          needs: check
          working-directory: pkg-r
          cache-version: 2
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: pkg-r

  # R-devel has no binary packages, so a cold cache compiles every dependency
  # from source, which takes 20 minutes or more. Pull requests skip it.
  check-devel:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      matrix:
        config:
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
    env: *check-env
    steps: *check-steps
