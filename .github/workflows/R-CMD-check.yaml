name: "R: R CMD check"

on:
  push:
    branches: [main]
    paths: [pkg-r/**, tests/shared/**, .github/workflows/R-CMD-check.yaml]
  pull_request:
    paths: [pkg-r/**, tests/shared/**, .github/workflows/R-CMD-check.yaml]
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 15
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: oldrel-2}
          - {os: ubuntu-latest, r: oldrel-3}
          - {os: ubuntu-latest, r: devel}
    env:
      COMMONS_SKIP_BROWSER_TESTS: "true"
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      # Temporary, with the job timeout: the runner's Azure Ubuntu mirror stalls apt.
      - name: Use the main Ubuntu archive for apt
        if: runner.os == 'Linux'
        run: |
          for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            if [ -f "$f" ]; then
              sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f"
            fi
          done
          if grep -rqs 'azure\.archive\.ubuntu\.com' /etc/apt; then
            echo "::error::apt still names azure.archive.ubuntu.com"
            exit 1
          fi
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      # pak finds no Posit Package Manager binaries for R-devel, whatever the
      # user agent, but R-universe builds them.
      - name: Use R-universe binaries on R-devel
        if: matrix.config.r == 'devel'
        shell: Rscript {0}
        run: |
          codename <- system2("lsb_release", c("--short", "--codename"), stdout = TRUE)
          url <- sprintf(
            "https://cran.r-universe.dev/bin/linux/%s-%s/%s/",
            codename, R.version$arch, as.character(getRversion()[, 1:2])
          )
          cat(
            sprintf('local({\n  repos <- getOption("repos")\n  repos[["RSPM"]] <- "%s"\n  options(repos = repos)\n})\n', url),
            file = "~/.Rprofile",
            append = TRUE
          )
      # BEGIN odbc workaround: remove this step once mac.cran.dev serves a
      # gzip odbc binary (posit-dev/commons#388). pak cannot extract the
      # Zstandard file it serves now, but pak keeps an installed copy whose
      # build matches, so install CRAN's copy first.
      - name: Install odbc from CRAN
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          install.packages("odbc", lib = lib, repos = "https://cran.r-project.org")
          stopifnot(nzchar(system.file(package = "odbc", lib.loc = lib)))
      # END odbc workaround
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          needs: check
          working-directory: pkg-r
          cache-version: 2
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: pkg-r
