name: "Py: Live warehouse tests"

on:
  push:
    branches: [main]
    paths: [pkg-py/**, tests/shared/**, .github/scripts/live-warehouse-configured.sh, .github/workflows/py-live-warehouse.yaml]
  workflow_dispatch:
  # TODO: REMOVE BEFORE MERGE. Temporary trigger to see the live tests pass on this stack's PRs.
  pull_request:
    paths: [pkg-py/**, tests/shared/**, .github/scripts/live-warehouse-configured.sh, .github/workflows/py-live-warehouse.yaml]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [databricks, snowflake]
    # Each backend's credentials live in its own environment. The Databricks
    # federation policy trusts this repository's `databricks-ci` environment
    # by name.
    environment:
      name: ${{ matrix.backend }}-ci
      # No deployment record for a test run. Databricks keeps the default
      # until its OIDC federation is verified without one.
      deployment: ${{ matrix.backend == 'databricks' }}
    permissions:
      contents: read
      # GitHub OIDC for the Databricks service principal.
      id-token: write
    defaults:
      run:
        working-directory: pkg-py
    env:
      UV_PYTHON: "3.13"
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      # Unset unless the federation policy accepts an audience other than the
      # workspace's token endpoint, which is what the SDK asks GitHub for.
      DATABRICKS_TOKEN_AUDIENCE: ${{ vars.DATABRICKS_TOKEN_AUDIENCE }}
      # Unset when the service principal signs in with GitHub OIDC instead.
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      COMMONS_TEST_DATABRICKS_SCHEMA: ${{ vars.COMMONS_TEST_DATABRICKS_SCHEMA }}
      COMMONS_TEST_DATABRICKS_DENIED_TABLE: ${{ vars.COMMONS_TEST_DATABRICKS_DENIED_TABLE }}
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      COMMONS_TEST_SNOWFLAKE_SCHEMA: ${{ vars.COMMONS_TEST_SNOWFLAKE_SCHEMA }}
      COMMONS_TEST_SNOWFLAKE_DENIED_TABLE: ${{ vars.COMMONS_TEST_SNOWFLAKE_DENIED_TABLE }}
      COMMONS_TEST_SNOWFLAKE_ALTERNATE_ROLE: ${{ vars.COMMONS_TEST_SNOWFLAKE_ALTERNATE_ROLE }}
    steps:
      - uses: actions/checkout@v6
      - name: Write the Snowflake private key
        if: matrix.backend == 'snowflake'
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          if [ -n "$SNOWFLAKE_PRIVATE_KEY" ]; then
            key="$RUNNER_TEMP/snowflake_key.p8"
            (umask 077 && printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$key")
            echo "SNOWFLAKE_PRIVATE_KEY_FILE=$key" >> "$GITHUB_ENV"
          fi
      - name: Check the configuration
        id: configured
        run: ../.github/scripts/live-warehouse-configured.sh '${{ matrix.backend }}'
      - uses: astral-sh/setup-uv@v6
        if: steps.configured.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: pkg-py/uv.lock
      - name: Install dependencies
        if: steps.configured.outputs.run == 'true'
        run: uv sync --locked --all-extras
      - name: Test
        if: steps.configured.outputs.run == 'true'
        run: uv run pytest tests/test_live_warehouses.py -k '${{ matrix.backend }}' -rs
