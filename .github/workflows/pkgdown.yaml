# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
    paths: [pkg-r/**, tests/shared/**, docs/**, .github/workflows/pkgdown.yaml]
  pull_request:
    paths: [pkg-r/**, tests/shared/**, docs/**, .github/workflows/pkgdown.yaml]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg-r
    # Every run that can push to gh-pages shares one group, including pull
    # request previews. Two pushes to one branch race, and the cleanup
    # workflow joins this group so a closing PR's build cannot recreate the
    # folder the cleanup just removed.
    concurrency:
      group: gh-pages
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
          working-directory: pkg-r

      - name: Build site
        run: pkgdown::build_site(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

      # A fork's GITHUB_TOKEN is read-only, so the deploy and the comment both
      # fail there. Fork previews are not worth the alternative: publishing
      # fork-authored HTML to posit-dev.github.io means serving unreviewed
      # content from our own origin.
      - name: Deploy the pull request preview 🔎
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          target-folder: pr-${{ github.event.number }}

      - name: Comment the preview link
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork != true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview-r
          message: |
            **R site preview:** [https://posit-dev.github.io/commons/pr-${{ github.event.number }}/r/](https://posit-dev.github.io/commons/pr-${{ github.event.number }}/r/)

            Built from the latest commit on this branch. The landing page's Python link resolves inside the preview only if this pull request also rebuilt the Python site.
